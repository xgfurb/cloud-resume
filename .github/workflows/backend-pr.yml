name: Backend Checks

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-pr.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # ratchet:actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-test.txt

      - name: Run tests
        run: pytest backend/counter/test_counter.py -v
