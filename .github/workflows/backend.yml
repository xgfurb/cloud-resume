# ============================================================
# BACKEND DEPLOYMENT WORKFLOW
# ============================================================
# Triggers on push to main when files in backend/ change.
# Runs tests, zips the Lambda code, and deploys it to AWS.
#
# Authentication: uses OIDC — same as frontend workflow.
# ============================================================

name: Deploy Backend

# Only run when backend files change on main branch
on:
  push:
    branches: [main]
    paths:
      - "backend/**"

permissions:
  id-token: write
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repo
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      # Step 2: Set up Python (matches Lambda runtime)
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # ratchet:actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install test dependencies
      # boto3 is included in the Lambda runtime but not on the
      # GitHub Actions runner, so we install it for tests.
      # moto mocks AWS services so tests don't hit real AWS.
      - name: Install dependencies
        run: pip install boto3 moto pytest

      # Step 4: Run tests
      # Tests must pass before deployment proceeds.
      # If any test fails, the workflow stops here —
      # broken code never reaches production.
      - name: Run tests
        run: pytest backend/counter/test_counter.py -v

      # Step 5: Authenticate with AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # ratchet:aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # Step 6: Zip and deploy Lambda function
      # Lambda expects a .zip file. We zip the Python file
      # and upload it directly using the AWS CLI.
      - name: Deploy Lambda
        run: |
          cd backend/counter
          zip lambda_function.zip lambda_function.py
          aws lambda update-function-code \
            --function-name cloud-resume-counter \
            --zip-file fileb://lambda_function.zip
