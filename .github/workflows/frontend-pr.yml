name: Frontend PR Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run htmlhint
        run: npm run lint

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Test frontend
        run: npm test
