name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '!terraform/bootstrap/**'
      - 'backend/**'
      - '.github/workflows/terraform-apply.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

defaults:
  run:
    shell: bash

# Never interrupt an in-flight apply. Old queued commits are rejected below.
concurrency:
  group: production-terraform
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Reject stale deployment
        run: |
          git fetch origin main
          git diff --quiet "$GITHUB_SHA" origin/main -- terraform backend .github/workflows/terraform-apply.yml ':!terraform/bootstrap' || { echo 'This commit is stale; deploy the latest main run.'; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Test backend
        run: |
          python -m pip install -r backend/requirements-test.txt
          python -m pytest backend/counter/test_counter.py -v

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.15.4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -input=false -lock-timeout=5m tfplan
