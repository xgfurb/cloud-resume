name: Terraform Plan

on:
  pull_request:

permissions:
  id-token: write
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for terraform changes
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED=$(git diff --name-only "origin/$BASE_REF"...HEAD -- terraform backend .github/workflows ':!terraform/bootstrap')
          if [ -n "$CHANGED" ]; then
            echo "terraform=true" >> $GITHUB_OUTPUT
          else
            echo "terraform=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Terraform
        if: steps.changes.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.15.4

      - name: Configure AWS credentials
        if: steps.changes.outputs.terraform == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # ratchet:aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Init
        if: steps.changes.outputs.terraform == 'true'
        working-directory: terraform
        env:
          TRUSTED_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$TRUSTED_PR" = "true" ]; then
            terraform init -input=false -lockfile=readonly
          else
            terraform init -backend=false -input=false -lockfile=readonly
          fi

      - name: Terraform Format Check
        if: steps.changes.outputs.terraform == 'true'
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        if: steps.changes.outputs.terraform == 'true'
        working-directory: terraform
        run: terraform validate

      - name: Test CI permission boundaries
        if: steps.changes.outputs.terraform == 'true'
        working-directory: terraform
        run: terraform test

      - name: Terraform Plan
        if: steps.changes.outputs.terraform == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        id: plan
        working-directory: terraform
        run: terraform plan -input=false -lock-timeout=60s -no-color 2>&1 | tee /tmp/plan.txt
        continue-on-error: true

      - name: Post Plan as PR Comment
        if: steps.changes.outputs.terraform == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # ratchet:actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/plan.txt', 'utf8');
            const truncated = plan.length > 65000
              ? '...(output truncated)\n' + plan.slice(-65000)
              : plan;
            const body = [
              '#### Terraform Plan',
              '<details><summary>Show Plan</summary>',
              '',
              '```',
              truncated,
              '```',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(c => c.user.login === 'github-actions[bot]' && c.body?.startsWith('#### Terraform Plan'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if plan failed
        if: steps.changes.outputs.terraform == 'true' && steps.plan.outcome == 'failure'
        run: exit 1

      - name: Explain fork validation
        if: steps.changes.outputs.terraform == 'true' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo 'Fork PR received format/validation checks only. A maintainer must review and plan on a trusted branch before merging.' >> "$GITHUB_STEP_SUMMARY"
