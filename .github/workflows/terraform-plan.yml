name: Terraform Plan

on:
  pull_request:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for terraform changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '^terraform/' | grep -v '^terraform/bootstrap/')
          if [ -n "$CHANGED" ]; then
            echo "terraform=true" >> $GITHUB_OUTPUT
          else
            echo "terraform=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Terraform
        if: steps.changes.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        if: steps.changes.outputs.terraform == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Init
        if: steps.changes.outputs.terraform == 'true'
        working-directory: terraform
        run: terraform init

      - name: Terraform Format Check
        if: steps.changes.outputs.terraform == 'true'
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        if: steps.changes.outputs.terraform == 'true'
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        if: steps.changes.outputs.terraform == 'true'
        id: plan
        working-directory: terraform
        run: terraform plan -no-color 2>&1 | tee /tmp/plan.txt
        continue-on-error: true

      - name: Post Plan as PR Comment
        if: steps.changes.outputs.terraform == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/plan.txt', 'utf8');
            const truncated = plan.length > 65000
              ? '...(output truncated)\n' + plan.slice(-65000)
              : plan;
            const body = [
              '#### Terraform Plan',
              '<details><summary>Show Plan</summary>',
              '',
              '```',
              truncated,
              '```',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(c => c.body.includes('#### Terraform Plan'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if plan failed
        if: steps.changes.outputs.terraform == 'true' && steps.plan.outcome == 'failure'
        run: exit 1
